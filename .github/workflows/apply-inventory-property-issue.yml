name: Apply inventory property issue

on:
  push:
    branches:
      - feature/escolas-emails

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/escolas-emails
          fetch-depth: 0

      - name: Apply issue changes
        run: |
          python3 <<'PY'
          from pathlib import Path

          home_path = Path("client/src/pages/Home.tsx")
          home = home_path.read_text(encoding="utf-8")

          home = home.replace(
              '  const [itemDialog, setItemDialog] = useState(false);\n',
              '  const [itemDialog, setItemDialog] = useState(false);\n  const [editingItem, setEditingItem] = useState<any>(null);\n',
              1,
          )

          old_add = '''  const addItem = trpc.inventory.addItem.useMutation({ onSuccess: async () => { toast.success("Item patrimonial incluído."); setItemDialog(false); await overviewQuery.refetch(); } });\n  const deleteItem = trpc.inventory.deleteItem.useMutation({ onSuccess: () => { toast.success("Item removido."); void overviewQuery.refetch(); } });'''
          new_add = '''  const addItem = trpc.inventory.addItem.useMutation({ onSuccess: async () => { toast.success("Item patrimonial incluído."); setItemDialog(false); setEditingItem(null); await overviewQuery.refetch(); } });\n  const updateItem = trpc.inventory.updateItem.useMutation({ onSuccess: async () => { toast.success("Item patrimonial atualizado."); setItemDialog(false); setEditingItem(null); await overviewQuery.refetch(); } });\n  const deleteItem = trpc.inventory.deleteItem.useMutation({ onSuccess: () => { toast.success("Item removido."); void overviewQuery.refetch(); } });'''
          if old_add not in home:
              raise SystemExit("Não encontrei o bloco de mutations de item em Home.tsx")
          home = home.replace(old_add, new_add, 1)

          old_card = '<InventoryItemsCard items={overview.items} categories={categoriesQuery.data ?? []} editable={editable} onAdd={() => setItemDialog(true)} onDelete={id => deleteItem.mutate({ itemId: id })} />'
          new_card = '<InventoryItemsCard items={overview.items} categories={categoriesQuery.data ?? []} editable={editable} onAdd={() => { setEditingItem(null); setItemDialog(true); }} onEdit={item => { setEditingItem(item); setItemDialog(true); }} onDelete={id => deleteItem.mutate({ itemId: id })} />'
          if old_card not in home:
              raise SystemExit("Não encontrei InventoryItemsCard em Home.tsx")
          home = home.replace(old_card, new_card, 1)

          old_dialog_mount = '{cycle && <ItemDialog open={itemDialog} onOpenChange={setItemDialog} categories={categoriesQuery.data ?? []} pending={addItem.isPending} onSave={fields => addItem.mutate({ cycleId: cycle.id, ...fields })} />}'
          new_dialog_mount = '{cycle && <ItemDialog open={itemDialog} onOpenChange={value => { setItemDialog(value); if (!value) setEditingItem(null); }} item={editingItem} categories={categoriesQuery.data ?? []} pending={addItem.isPending || updateItem.isPending} onSave={fields => editingItem ? updateItem.mutate({ itemId: editingItem.id, cycleId: cycle.id, ...fields }) : addItem.mutate({ cycleId: cycle.id, ...fields })} />}'
          if old_dialog_mount not in home:
              raise SystemExit("Não encontrei a montagem de ItemDialog em Home.tsx")
          home = home.replace(old_dialog_mount, new_dialog_mount, 1)

          old_signature = 'function InventoryItemsCard({ items, categories, editable, onAdd, onDelete }: { items: any[]; categories: any[]; editable?: boolean; onAdd: () => void; onDelete: (id: number) => void }) {'
          new_signature = 'function InventoryItemsCard({ items, categories, editable, onAdd, onEdit, onDelete }: { items: any[]; categories: any[]; editable?: boolean; onAdd: () => void; onEdit: (item: any) => void; onDelete: (id: number) => void }) {'
          if old_signature not in home:
              raise SystemExit("Não encontrei a assinatura de InventoryItemsCard")
          home = home.replace(old_signature, new_signature, 1)

          old_actions = '{editable && <td className="px-4 py-4"><button onClick={() => onDelete(item.id)} className="rounded-lg p-1.5 text-[#9a5548] hover:bg-rose-50" aria-label="Remover item"><X className="size-4" /></button></td>}'
          new_actions = '{editable && <td className="px-4 py-4"><div className="flex items-center gap-1"><button onClick={() => onEdit(item)} className="rounded-lg p-1.5 text-[#356b57] hover:bg-[#e8f1e8]" aria-label="Editar item" title="Editar item"><PencilLine className="size-4" /></button><button onClick={() => onDelete(item.id)} className="rounded-lg p-1.5 text-[#9a5548] hover:bg-rose-50" aria-label="Remover item" title="Remover item"><X className="size-4" /></button></div></td>}'
          if old_actions not in home:
              raise SystemExit("Não encontrei as ações da tabela de itens")
          home = home.replace(old_actions, new_actions, 1)

          old_dialog = '''function ItemDialog({ open, onOpenChange, categories, pending, onSave }: { open: boolean; onOpenChange: (value: boolean) => void; categories: any[]; pending: boolean; onSave: (fields: any) => void }) { const [scannerOpen, setScannerOpen] = useState(false); const [propertyNumber, setPropertyNumber] = useState(""); useEffect(() => { if (open) { setScannerOpen(false); setPropertyNumber(""); } }, [open]); return <><Dialog open={open} onOpenChange={onOpenChange}><DialogContent className="max-h-[90vh] overflow-y-auto sm:max-w-3xl"><DialogHeader><DialogTitle>Adicionar bem patrimonial</DialogTitle><DialogDescription>O valor total é calculado automaticamente a partir da quantidade e do valor unitário.</DialogDescription></DialogHeader><form onSubmit={event => { event.preventDefault(); const data = new FormData(event.currentTarget); onSave({ propertyNumber: safeText(data.get("propertyNumber")), quantity: Number(data.get("quantity")), description: safeText(data.get("description")), technicalDetails: safeText(data.get("technicalDetails")) || null, expenseCode: safeText(data.get("expenseCode")), conservationCode: safeText(data.get("conservationCode")) || null, conservationState: safeText(data.get("conservationState")), unitValue: Number(data.get("unitValue")), currentSituation: safeText(data.get("currentSituation")) }); }} className="space-y-4"><div className="grid gap-4 sm:grid-cols-2"><Field label="N.º de património"><div className="flex gap-2"><Input name="propertyNumber" value={propertyNumber} onChange={event => setPropertyNumber(event.target.value)} required className="min-w-0" placeholder="Digite ou leia pela câmera" /><Button type="button" variant="outline" onClick={() => setScannerOpen(true)} aria-label="Ler código de barras pela câmera" title="Ler código de barras pela câmera" className="shrink-0 px-3"><ScanLine className="mr-1.5 size-4" />Ler</Button></div><p className="text-[11px] leading-4 text-[#718277]">Use a câmera para preencher este número automaticamente.</p></Field><Field label="Quantidade"><Input name="quantity" required type="number" min="1" defaultValue="1" /></Field><Field label="Descrição do bem" className="sm:col-span-2"><Input name="description" required placeholder="Ex.: Mesa em L" /></Field><Field label="Detalhes técnicos" className="sm:col-span-2"><Textarea name="technicalDetails" placeholder="Marca, modelo, dimensões ou outra referência." /></Field><Field label="Código de despesa"><Select name="expenseCode" defaultValue="52.14"><SelectTrigger><SelectValue /></SelectTrigger><SelectContent>{(categories?.length ? categories : expenseCodes.map(code => ({ code, label: code }))).map((category: any) => <SelectItem key={category.code} value={category.code}>{category.code} · {category.label}</SelectItem>)}</SelectContent></Select></Field><Field label="Código de conservação"><Input name="conservationCode" placeholder="Ex.: 2 - Bom" /></Field><Field label="Estado de conservação"><Select name="conservationState" defaultValue="Bom"><SelectTrigger><SelectValue /></SelectTrigger><SelectContent>{["Novo", "Bom", "Regular", "Mau", "Inservível"].map(state => <SelectItem key={state} value={state}>{state}</SelectItem>)}</SelectContent></Select></Field><Field label="Valor unitário (R$)"><Input name="unitValue" required type="number" min="0" step="0.01" /></Field><Field label="Situação atual" className="sm:col-span-2"><Input name="currentSituation" required defaultValue="Em uso" placeholder="Ex.: Em uso, estocado, em manutenção" /></Field></div><DialogFooter><Button type="button" variant="outline" onClick={() => onOpenChange(false)}>Cancelar</Button><Button disabled={pending} type="submit" className="bg-[#0c4a3e] hover:bg-[#083a31]">{pending && <Loader2 className="mr-2 size-4 animate-spin" />}Adicionar item</Button></DialogFooter></form></DialogContent></Dialog><BarcodeScannerDialog open={scannerOpen} onOpenChange={setScannerOpen} onDetected={code => { setPropertyNumber(code); setScannerOpen(false); toast.success("Número patrimonial preenchido pela câmera."); }} /></>; }'''

          new_dialog = '''function ItemDialog({ open, onOpenChange, item, categories, pending, onSave }: { open: boolean; onOpenChange: (value: boolean) => void; item?: any; categories: any[]; pending: boolean; onSave: (fields: any) => void }) { const [scannerOpen, setScannerOpen] = useState(false); const [propertyNumber, setPropertyNumber] = useState(""); const [propertyMode, setPropertyMode] = useState<"required" | "not_applicable">("required"); useEffect(() => { if (open) { setScannerOpen(false); const value = item?.propertyNumber ?? ""; setPropertyNumber(value); setPropertyMode(value === "Não se aplica" ? "not_applicable" : "required"); } }, [open, item]); return <><Dialog open={open} onOpenChange={onOpenChange}><DialogContent className="max-h-[90vh] overflow-y-auto sm:max-w-3xl"><DialogHeader><DialogTitle>{item ? "Editar bem patrimonial" : "Adicionar bem patrimonial"}</DialogTitle><DialogDescription>O valor total é calculado automaticamente a partir da quantidade e do valor unitário.</DialogDescription></DialogHeader><form onSubmit={event => { event.preventDefault(); const data = new FormData(event.currentTarget); onSave({ propertyNumber: safeText(data.get("propertyNumber")), quantity: Number(data.get("quantity")), description: safeText(data.get("description")), technicalDetails: safeText(data.get("technicalDetails")) || null, expenseCode: safeText(data.get("expenseCode")), conservationCode: safeText(data.get("conservationCode")) || null, conservationState: safeText(data.get("conservationState")), unitValue: Number(data.get("unitValue")), currentSituation: safeText(data.get("currentSituation")) }); }} className="space-y-4"><div className="grid gap-4 sm:grid-cols-2"><Field label="Identificação patrimonial"><div className="mb-2 flex flex-wrap gap-2"><Button type="button" variant={propertyMode === "required" ? "default" : "outline"} onClick={() => { setPropertyMode("required"); setPropertyNumber(""); }} className={propertyMode === "required" ? "bg-[#0c4a3e] hover:bg-[#083a31]" : ""}>Possui patrimônio</Button><Button type="button" variant={propertyMode === "not_applicable" ? "default" : "outline"} onClick={() => { setPropertyMode("not_applicable"); setPropertyNumber("Não se aplica"); }} className={propertyMode === "not_applicable" ? "bg-[#0c4a3e] hover:bg-[#083a31]" : ""}>Não se aplica</Button></div><div className="flex gap-2"><Input name="propertyNumber" value={propertyNumber} onChange={event => setPropertyNumber(event.target.value)} required disabled={propertyMode === "not_applicable"} className="min-w-0" placeholder={propertyMode === "required" ? "Digite ou leia pela câmera" : "Não se aplica"} /><Button type="button" variant="outline" disabled={propertyMode === "not_applicable"} onClick={() => setScannerOpen(true)} aria-label="Ler código de barras pela câmera" title="Ler código de barras pela câmera" className="shrink-0 px-3"><ScanLine className="mr-1.5 size-4" />Ler</Button></div><p className="text-[11px] leading-4 text-[#718277]">{propertyMode === "required" ? "Informe o número patrimonial ou leia pela câmera." : "Este bem será registado sem identificação patrimonial."}</p></Field><Field label="Quantidade"><Input name="quantity" required type="number" min="1" defaultValue={item?.quantity ?? 1} /></Field><Field label="Descrição do bem" className="sm:col-span-2"><Input name="description" required defaultValue={item?.description || ""} placeholder="Ex.: Mesa em L" /></Field><Field label="Detalhes técnicos" className="sm:col-span-2"><Textarea name="technicalDetails" defaultValue={item?.technicalDetails || ""} placeholder="Marca, modelo, dimensões ou outra referência." /></Field><Field label="Código de despesa"><Select name="expenseCode" defaultValue={item?.expenseCode || "52.14"}><SelectTrigger><SelectValue /></SelectTrigger><SelectContent>{(categories?.length ? categories : expenseCodes.map(code => ({ code, label: code }))).map((category: any) => <SelectItem key={category.code} value={category.code}>{category.code} · {category.label}</SelectItem>)}</SelectContent></Select></Field><Field label="Código de conservação"><Input name="conservationCode" defaultValue={item?.conservationCode || ""} placeholder="Ex.: 2 - Bom" /></Field><Field label="Estado de conservação"><Select name="conservationState" defaultValue={item?.conservationState || "Bom"}><SelectTrigger><SelectValue /></SelectTrigger><SelectContent>{["Novo", "Bom", "Regular", "Mau", "Inservível"].map(state => <SelectItem key={state} value={state}>{state}</SelectItem>)}</SelectContent></Select></Field><Field label="Valor unitário (R$)"><Input name="unitValue" required type="number" min="0" step="0.01" defaultValue={item?.unitValue ?? ""} /></Field><Field label="Situação atual" className="sm:col-span-2"><Input name="currentSituation" required defaultValue={item?.currentSituation || "Em uso"} placeholder="Ex.: Em uso, estocado, em manutenção" /></Field></div><DialogFooter><Button type="button" variant="outline" onClick={() => onOpenChange(false)}>Cancelar</Button><Button disabled={pending} type="submit" className="bg-[#0c4a3e] hover:bg-[#083a31]">{pending && <Loader2 className="mr-2 size-4 animate-spin" />}{item ? "Guardar alterações" : "Adicionar item"}</Button></DialogFooter></form></DialogContent></Dialog><BarcodeScannerDialog open={scannerOpen} onOpenChange={setScannerOpen} onDetected={code => { setPropertyNumber(code); setPropertyMode("required"); setScannerOpen(false); toast.success("Número patrimonial preenchido pela câmera."); }} /></>; }'''
          if old_dialog not in home:
              raise SystemExit("Não encontrei o ItemDialog atual em Home.tsx")
          home = home.replace(old_dialog, new_dialog, 1)
          home_path.write_text(home, encoding="utf-8")

          routers_path = Path("server/routers.ts")
          routers = routers_path.read_text(encoding="utf-8")
          marker = '''    deleteItem: protectedProcedure.input(z.object({ itemId: z.number().int().positive() })).mutation(async ({ ctx, input }) => {'''
          update_block = '''    updateItem: protectedProcedure
      .input(
        z.object({
          itemId: z.number().int().positive(),
          cycleId: z.number().int().positive(),
          propertyNumber: z.string().trim().min(1).max(80),
          quantity: z.number().int().min(1).max(1000000),
          description: z.string().trim().min(2).max(4000),
          technicalDetails: z.string().trim().max(4000).optional().nullable(),
          expenseCode: z.string().trim().regex(/^52\\.(0[1-9]|1[0-9]|2[0-2]|25|26|99)$/),
          conservationCode: z.string().trim().max(32).optional().nullable(),
          conservationState: z.string().trim().min(2).max(80),
          unitValue: z.number().min(0).max(999999999),
          currentSituation: z.string().trim().min(2).max(160),
        }),
      )
      .mutation(async ({ ctx, input }) => {
        const cycle = await assertEditableCycle(ctx.user, input.cycleId);
        const db = await requireDb();
        const item = await db.select().from(inventoryItems).where(eq(inventoryItems.id, input.itemId)).limit(1);
        if (!item[0]) throw new TRPCError({ code: "NOT_FOUND", message: "Item não encontrado." });
        if (item[0].cycleId !== cycle.id) throw accessDenied();
        const { itemId, cycleId, unitValue, quantity, ...fields } = input;
        const totalValue = calculateLineTotal(quantity, unitValue);
        await db.update(inventoryItems).set({ ...fields, cycleId, quantity, unitValue: unitValue.toFixed(2), totalValue }).where(eq(inventoryItems.id, itemId));
        return { id: itemId, totalValue };
      }),
'''
          if marker not in routers:
              raise SystemExit("Não encontrei deleteItem em server/routers.ts")
          routers = routers.replace(marker, update_block + marker, 1)
          routers_path.write_text(routers, encoding="utf-8")
          PY

      - name: Validate
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm check
          pnpm test -- --run

      - name: Commit changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/Home.tsx server/routers.ts .github/workflows/apply-inventory-property-issue.yml
          git rm .github/workflows/apply-inventory-property-issue.yml
          git commit -m "feat: exige identificacao patrimonial ou nao se aplica"
          git push origin feature/escolas-emails
